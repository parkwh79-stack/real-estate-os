name: REALYTICS CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: realytics-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: realytics
          POSTGRES_USER: realytics
          POSTGRES_PASSWORD: realytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realytics -d realytics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api-server
    env:
      REALYTICS_DATABASE_URL: postgresql://realytics:realytics@127.0.0.1:5432/realytics
      REALYTICS_TEST_DATABASE_URL: postgresql://realytics:realytics@127.0.0.1:5432/realytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply all PostgreSQL migrations
        run: python -c "from db.postgres import connect, ensure_schema; c=connect(); ensure_schema(c); c.close()"
      - name: Run typed PostgreSQL integration tests
        run: python -m pytest -q tests/test_postgres_seam.py tests/test_postgres_state_store.py tests/test_postgres_typed_integration.py

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-types --workspace=web
      - run: npm run lint --workspace=web
      - run: npm run build --workspace=web

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=web
