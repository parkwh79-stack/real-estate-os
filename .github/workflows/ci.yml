name: REALYTICS CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: realytics-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Prepare verified offline OCR languages
        run: python -m scripts.prepare_ocr_languages --directory "${{ runner.temp }}/realytics-ocr-data"
      - run: python -m compileall -q .
      - run: python -m pytest -q
        env:
          OCR_TEST_TESSDATA_DIR: ${{ runner.temp }}/realytics-ocr-data

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: realytics
          POSTGRES_USER: realytics
          POSTGRES_PASSWORD: realytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realytics -d realytics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api-server
    env:
      REALYTICS_DATABASE_URL: postgresql://realytics:realytics@127.0.0.1:5432/realytics?options=-csearch_path%3Drealytics%2Cpublic
      REALYTICS_TEST_DATABASE_URL: postgresql://realytics:realytics@127.0.0.1:5432/realytics?options=-csearch_path%3Drealytics%2Cpublic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-server/requirements.txt
      - name: Verify rendered Supabase migrations
        run: python scripts/render_supabase_migrations.py --check
      - run: pip install -r requirements.txt
      - name: Bootstrap dedicated database roles
        run: python scripts/bootstrap_test_postgres.py
      - name: Apply all PostgreSQL migrations
        run: python -c "from db.postgres import connect, ensure_schema; c=connect(); c.execute('CREATE SCHEMA IF NOT EXISTS realytics'); c.commit(); ensure_schema(c); c.close()"
      - name: Run typed PostgreSQL integration tests
        run: python -m pytest -q tests/test_postgres_seam.py tests/test_postgres_state_store.py tests/test_postgres_typed_integration.py tests/test_parser_v2_postgres_live.py --junitxml=postgres-results.xml
      - name: Reject skipped PostgreSQL release checks
        run: python -c "import xml.etree.ElementTree as ET; r=ET.parse('postgres-results.xml'); assert not r.findall('.//skipped'), 'PostgreSQL checks must execute, not skip'"

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run check-types --workspace=web
      - run: npm run lint --workspace=web
      - run: npm run build --workspace=web

  cleanup-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -q scripts/tests/test_cleanup_generated.py scripts/tests/test_public_repository_contract.py

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=web
